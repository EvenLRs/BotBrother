name: Build & Test Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR 要求全小写；github.repository 可能含大写（如 EvenLRs/BotBrother）
  IMAGE_NAME: ${{ github.repository }}   # 原始名仅展示用，推送用下面的 LC


jobs:
  build-test:
    env:
      IMAGE_LC: ${{ github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 静态检查：Dockerfile/compose 语法（本地无法验证的，CI 补上） ----------
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true   # 建议级：告警不挡构建

      # ---------- 单元测试（tests/ 为本地开发资产不入库；若仓库出现则跑，否则容器级测试兜底） ----------
      - name: Run unit tests if tests/ present (Python 3.9 floor)
        run: |
          if [ -d tests ] && ls tests/test_*.py > /dev/null 2>&1; then
            docker run --rm -v "$PWD":/app -w /app python:3.9-alpine \
              python3 -m unittest discover -s tests -v
          else
            echo "[SKIP] tests/ not in repo (local-only); container-level tests below cover the runtime"
          fi

      # ---------- 构建测试镜像（单架构 + load 进本地 docker 供容器测试用） ----------
      # 注意：buildx 的 docker exporter 不支持多架构 manifest list，
      # 所以测试阶段只构 amd64；双架构构建放在最后的推送步（push 直出 registry）。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: botbrother:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 容器级测试：真容器 + 真 WebUI + 假 OneBot 三幕验证 ----------
      - name: Test container against a fake OneBot
        run: |
          set -e
          # 1) 假 OneBot：本仓库 tests 里已有现成实现思路，这里内联一个最小版
          cat > fake_onebot.py <<'PY'
          import json, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              online = True
              def do_POST(self):
                  if self.path.split('?')[0] == '/get_status':
                      body = json.dumps({'status':'ok','retcode':0,
                          'data':{'online':self.online,'good':True}}).encode()
                      self.send_response(200)
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers(); self.wfile.write(body)
                  else:
                      self.send_response(404)
                      self.send_header('Content-Length','0'); self.end_headers()
              def log_message(self,*a): pass
          if __name__ == '__main__':
              import sys
              port = int(sys.argv[1])
              H.online = sys.argv[2] == 'online' if len(sys.argv) > 2 else True
              HTTPServer(('0.0.0.0', port), H).serve_forever()
          PY

          # 2) 最小配置：监视假 OneBot，log 渠道；config 与 Dockerfile HEALTHCHECK/CMD 统一放 /app/data/config.json。
          #    data_dir 用 "."：认证数据写入同一可写目录 /app/data（镜像内已 chown botbrother），避免改路径后落盘失败。
          cat > test-config.json <<'JSON'
          {
            "interval": 5,
            "endpoints": [
              {"label": "ci-fake", "base": "http://172.17.0.1:3999", "token": "", "timeout": 3, "debounce": 2}
            ],
            "channels": [{"type": "log"}],
            "webui": {"port": 8080, "bind": "0.0.0.0", "data_dir": "."}
          }
          JSON

          # 3) 起假 OneBot（宿主机网络侧，容器经 docker 网桥网关访问）
          python3 fake_onebot.py 3999 online &
          FAKE_PID=$!

          # 4) 起 BotBrother 容器（WebUI 模式；镜像默认 CMD 无 --webui，测试显式带参）
          docker run -d --name bb-test -p 18080:8080 \
            -v "$PWD/test-config.json":/app/data/config.json:ro \
            botbrother:ci-test python3 monitor.py --config /app/data/config.json --webui

          # 4.1) 就绪轮询：最多 30 次×2s 等 WebUI 端口可连（runner 冷启慢，死等 sleep 不可靠）
          READY=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:18080/; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "[FAIL] WebUI 未在 60s 内就绪，容器日志："
            docker logs bb-test 2>&1 | tail -30
            exit 1
          fi
          echo "[PASS] webui page 200"
          # 首轮探测（interval 5s）也给足时间
          sleep 6

          # 5) 认证流程（密码会话，取代已退役的 webui.token/Bearer）：
          #    未登录 401 → /api/auth/setup → cookie 访问 /api/state → logout → login → 再访问。
          #    所有 POST 需同源 Origin + 自定义头 X-BB-CSRF: 1；临时 CI 密码随机生成，不回显、不入日志。
          BASE=http://127.0.0.1:18080
          ORIGIN="$BASE"
          COOKIE_JAR="$(mktemp)"
          SETUP_BODY="$(mktemp)"
          LOGIN_BODY="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" "$SETUP_BODY" "$LOGIN_BODY"' EXIT
          CI_PW="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
          chmod 600 "$SETUP_BODY" "$LOGIN_BODY"
          printf '{"password":"%s","confirm":"%s"}' "$CI_PW" "$CI_PW" > "$SETUP_BODY"
          printf '{"password":"%s"}' "$CI_PW" > "$LOGIN_BODY"
          post() {  # post <path> <data-file|->  → 输出 HTTP 码（带 cookie jar / CSRF / Origin）
            local path="$1" data="$2"
            if [ "$data" = "-" ]; then
              curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
                -H "X-BB-CSRF: 1" -H "Origin: $ORIGIN" -X POST "$BASE$path"
            else
              curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
                -H "Content-Type: application/json" -H "X-BB-CSRF: 1" -H "Origin: $ORIGIN" \
                -X POST --data @"$data" "$BASE$path"
            fi
          }
          state_of() { curl -sf -b "$COOKIE_JAR" "$BASE/api/state" | python3 -c "import sys,json;print(json.load(sys.stdin)['state'])"; }

          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/state")
          [ "$CODE" = "401" ] && echo "[PASS] unauth /api/state 401" || { echo "[FAIL] expected 401, got $CODE"; exit 1; }

          CODE=$(post /api/auth/setup "$SETUP_BODY")
          [ "$CODE" = "200" ] && echo "[PASS] setup 200 (session cookie issued)" || { echo "[FAIL] setup got $CODE"; docker logs bb-test 2>&1 | tail -30; exit 1; }

          STATE="$(state_of)"
          [ "$STATE" = "online" ] && echo "[PASS] state=online (via session cookie)" || { echo "[FAIL] state=$STATE"; docker logs bb-test 2>&1 | tail -10; exit 1; }

          # 认证数据确实落到可写目录：验证 data_dir 解析与写权限
          docker exec -u botbrother bb-test sh -c 'test -s /app/data/webui_auth.json' \
            && echo "[PASS] auth persisted to writable /app/data" \
            || { echo "[FAIL] auth file missing (data_dir/permission?)"; docker logs bb-test 2>&1 | tail -30; exit 1; }

          CODE=$(post /api/auth/logout -)
          [ "$CODE" = "200" ] && echo "[PASS] logout 200" || { echo "[FAIL] logout got $CODE"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/state")
          [ "$CODE" = "401" ] && echo "[PASS] post-logout /api/state 401" || { echo "[FAIL] expected 401 after logout got $CODE"; exit 1; }

          CODE=$(post /api/auth/login "$LOGIN_BODY")
          [ "$CODE" = "200" ] && echo "[PASS] login 200 (session cookie re-issued)" || { echo "[FAIL] login got $CODE"; docker logs bb-test 2>&1 | tail -30; exit 1; }
          STATE="$(state_of)"
          [ "$STATE" = "online" ] && echo "[PASS] state=online after re-login" || { echo "[FAIL] state=$STATE"; exit 1; }

          # 6) 幕二：--once 健康检查（config 路径与容器统一为 /app/data/config.json）
          RC=0
          docker run --rm --network host -v "$PWD/test-config.json":/app/data/config.json:ro \
            botbrother:ci-test python3 monitor.py --config /app/data/config.json --once || RC=$?
          [ "$RC" = "0" ] && echo "[PASS] --once exits 0 when online" || { echo "[FAIL] --once rc=$RC"; exit 1; }

          # 7) 收尾：关假 OneBot → 服务不可达 → 容器日志应出现探测记录
          docker logs bb-test 2>&1 | grep -q "探测" && echo "[PASS] container logs probing"
          docker rm -f bb-test > /dev/null
          kill $FAKE_PID 2>/dev/null || true

      # ---------- 容器级测试：离线场景（假 OneBot 一直不在线） ----------
      - name: Test container detects offline (unreachable)
        run: |
          # 不起假服务：端口拒连 → unreachable，--once 退出码应为 1
          cat > test-config2.json <<'JSON'
          {
            "interval": 5,
            "endpoints": [
              {"label": "ci-dead", "base": "http://172.17.0.1:3998", "token": "", "timeout": 2, "debounce": 3}
            ],
            "channels": [{"type": "log"}],
            "webui": {"port": 8080, "bind": "0.0.0.0", "data_dir": "."}
          }
          JSON
          RC=0
          docker run --rm --network host -v "$PWD/test-config2.json":/app/data/config.json:ro \
            botbrother:ci-test python3 monitor.py --config /app/data/config.json --once || RC=$?
          if [ "$RC" -ne 1 ]; then echo "[FAIL] expected exit 1, got $RC"; exit 1; fi
          echo "[PASS] --once exits 1 when unreachable"

      # ---------- 推送 GHCR（仅 main 分支；PR 只构建不推送） ----------
      - name: Set up QEMU (multi-arch for push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_LC }}:latest
            ghcr.io/${{ env.IMAGE_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
