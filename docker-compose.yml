services:
  botbrother:
    build: .
    image: botbrother:latest
    container_name: botbrother
    restart: unless-stopped
    volumes:
      # 可写数据目录：存放 config.json（WebUI 保存配置需原子写）与登录密码认证数据。
      # 请把 config.json 放在宿主机 ./data/ 下（初次可 cp config.example.json data/config.json）。
      # 目录整体挂载才能支持 os.replace 原子替换；单文件 :ro 挂载会令保存失败。
      - ./data:/app/data
    environment:
      - QQMON_INTERVAL=30
      - QQMON_DEBOUNCE=3
      # - QQMON_PROBE_BASE=http://host.docker.internal:3000
      # - QQMON_PROBE_TOKEN=
    # NapCat 若也在容器里，须同网络且 base 用服务名/网关地址
    extra_hosts:
      - "host.docker.internal:host-gateway"
